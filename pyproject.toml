[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repository-release-readiness-checker"
version = "1.0.0"
description = "A read-only release audit for public software repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
keywords = ["release", "repository", "audit", "open-source"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]

[project.scripts]
release-ready = "release_ready.cli:main"

[project.urls]
Homepage = "https://github.com/loganpendragonmultiverse/repository-release-readiness-checker"
Issues = "https://github.com/loganpendragonmultiverse/repository-release-readiness-checker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/release_ready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
