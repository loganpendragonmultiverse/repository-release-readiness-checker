name: Release artifacts
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pytest build
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import importlib.metadata, os
          from release_ready import __version__
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          assert importlib.metadata.version("repository-release-readiness-checker") == expected
          assert __version__ == expected
          PY
      - run: python -m pytest
      - run: python -m build
      - run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
